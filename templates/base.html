<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Graveyard of Dead Software{% endblock %}</title>
  <meta name="description" content="{% block description %}A public cemetery for dead software, apps, and websites -- exhumed from the Wayback Machine, eulogized by Gemma.{% endblock %}">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230E0C0A'/><path d='M50 20 L70 70 L30 70 Z' fill='%23F2A22A'/></svg>">
</head>
<body>
  <!-- Papel picado banner -->
  <div class="papel-picado" aria-hidden="true">
    <svg class="flag marigold" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag ember" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag marigold" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag ember" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag marigold" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag ember" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag marigold" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
    <svg class="flag ember" viewBox="0 0 40 40"><polygon points="20,0 35,20 20,40 5,20"/></svg>
  </div>

  <nav class="nav">
    <a href="/" class="nav-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 20 L4 20 Z" fill="currentColor"/></svg>
      Graveyard of Dead Software
    </a>
    <ul class="nav-links">
      <li><a href="/">Cemetery</a></li>
      <li><a href="/benchmark">Benchmark</a></li>
      <li><a href="#bury">Bury a Project</a></li>
    </ul>
  </nav>

  {% block content %}{% endblock %}

  <!-- Falling marigold petals -->
  <div class="petals-container" aria-hidden="true" id="petals-container"></div>

  <div class="fog-layer"></div>

  <div class="grain" aria-hidden="true"></div>
  <footer class="site-footer">
    <p>Run on open weights &mdash; it cannot die. &middot; Powered by Gemma &amp; Browserbase &middot; All dates via Wayback Machine</p>
    <p>Warning: Written by AI from archived pages. Details may be wrong.</p>
  </footer>

  <script>
  (function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const container = document.getElementById('petals-container');
    if (!container) return;
    const svg = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2c1.5 2 3 3 5 3-1 2-2.5 3-4 4 1 1.5 1.5 3 1 5-2-1-3.5-2.5-5-4-1.5 1.5-3 3-5 4 0-2 .5-3.5 1.5-5-1.5-1-3-2-4-4 2 0 3.5-1 5-3z" fill="var(--marigold)"/></svg>';
    function spawnPetal(){
      const el = document.createElement('div');
      el.className = 'petal';
      el.innerHTML = svg;
      el.style.left = Math.random()*100 + 'vw';
      el.style.animationDuration = (6 + Math.random()*8) + 's';
      el.style.animationDelay = (Math.random()*4) + 's';
      el.style.opacity = 0.4 + Math.random()*0.4;
      container.appendChild(el);
      setTimeout(()=>el.remove(),15000);
    }
    for(let i=0;i<8;i++) spawnPetal();
    setInterval(spawnPetal,1800);
  })();
  </script>
</body>
</html>
